name: Opdater podcast-RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Byg samlet podcast-feed
        run: python build_feed.py
      - name: Upload til GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Udgiv GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
